name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name XhamiaFrankenthalPRO app.py
      - name: Smoke test EXE presence
        shell: pwsh
        run: |
          if (!(Test-Path "dist/XhamiaFrankenthalPRO.exe")) { throw "EXE missing" }
          if ((Get-Item "dist/XhamiaFrankenthalPRO.exe").Length -lt 1000000) { throw "EXE unexpectedly small" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Create Windows setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: XhamiaFrankenthalPRO-Installer
          path: |
            installer/XhamiaFrankenthalPRO-Setup.exe
            dist/XhamiaFrankenthalPRO.exe
          if-no-files-found: error
