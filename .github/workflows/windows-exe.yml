name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name XhamiaFrankenthalPRO app.py
      - uses: actions/upload-artifact@v4
        with:
          name: XhamiaFrankenthalPRO-Windows-EXE
          path: dist/XhamiaFrankenthalPRO.exe
